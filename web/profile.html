<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your profile · Nishkam</title>
<link rel="icon" href="brand/favicon.svg">
<style>
:root{--bg:#000;--ink:#f5f5f7;--muted:#a1a1a6;--brand:#1430ff;--hi:#4a63ff;--panel:#1c1c1e;--glass:rgba(255,255,255,.06);--edge:rgba(255,255,255,.14);--bad:#ff6961;--ok:#30d158;--sans:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 600px at 80% -10%,rgba(20,48,255,.28),transparent 70%),var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;max-width:1160px;margin:0 auto;padding:16px}
.top .logo{margin-right:auto;font-weight:600;font-size:20px;letter-spacing:-.01em;text-decoration:none}
[hidden]{display:none!important}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:4px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--ink);font:14px var(--sans);text-decoration:none;white-space:nowrap;cursor:pointer}
span.pill{cursor:default;color:var(--muted)}
.dd{position:relative}.ddtrg svg{opacity:.7;transition:transform .15s}.dd.open .ddtrg svg{transform:rotate(180deg)}
.av{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:inline-grid;place-items:center;font-size:12px;object-fit:cover}
.ddpanel{position:absolute;top:calc(100% + 8px);right:0;z-index:50;min-width:220px;max-width:calc(100vw - 32px);padding:6px;border-radius:16px;background:rgba(18,20,30,.85);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(-4px) scale(.97);transform-origin:top right;visibility:hidden;transition:opacity .14s,transform .14s,visibility 0s .14s}
.dd.open .ddpanel{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.ddpanel .mh{padding:8px 12px 10px;display:flex;flex-direction:column;gap:2px;font-size:14px;border-bottom:1px solid var(--edge);margin-bottom:4px}.ddpanel .mh span{color:var(--muted);font-size:12px}
.ddpanel hr{border:0;border-top:1px solid var(--edge);margin:4px 0}
.mi{display:block;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:10px;background:none;color:inherit;font:14px var(--sans);text-decoration:none;cursor:pointer}
.mi:hover,.mi:focus-visible{background:rgba(255,255,255,.12);outline:none}
.wrap{max-width:1160px;margin:0 auto;padding:8px 16px 64px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.wrap{grid-template-columns:340px minmax(0,1fr);align-items:start}.id{position:sticky;top:16px}}
@media(max-width:699px){.nophone{display:none}.pill{min-height:44px}.mi{padding:12px}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.id{padding:0;overflow:hidden}.id .body{padding:0 24px 24px}
.gh{position:relative;height:96px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.gh i{position:absolute;border-radius:50%;will-change:transform}
.gh .l1{width:240px;height:240px;left:-40px;top:-120px;background:radial-gradient(circle,rgba(74,99,255,.25),transparent 70%);animation:drift1 26s ease-in-out infinite alternate}
.gh .l2{width:200px;height:200px;right:-30px;top:-60px;background:radial-gradient(circle,rgba(20,48,255,.25),transparent 70%);animation:drift2 22s ease-in-out infinite alternate}
.gh .gl{position:absolute;inset:0;background:rgba(255,255,255,.03);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8)}
@keyframes drift1{to{transform:translate3d(160px,40px,0)}}
@keyframes drift2{to{transform:translate3d(-180px,30px,0)}}
@media(prefers-reduced-motion:reduce){.gh i{animation:none}}
.avrow{display:flex;align-items:flex-end;gap:12px;margin-top:-48px;position:relative}
.ring{box-shadow:0 0 0 2px #4a63ff,0 0 22px 2px rgba(74,99,255,.55),inset 0 1px 0 rgba(255,255,255,.45)!important}
.lbn{display:inline-flex;align-items:center;gap:8px}
.pickrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crop{margin-top:16px;display:grid;gap:12px;justify-items:start}
.crop canvas{width:192px;height:192px;border-radius:12px;touch-action:none;cursor:grab;background:#000;max-width:100%}
.crop input[type=range]{width:192px;min-height:30px;padding:0;background:none;border:0;-webkit-appearance:none;appearance:none}
.crop input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--edge);border-radius:999px}
.crop input[type=range]::-moz-range-track{height:2px;background:var(--edge);border-radius:999px}
.crop input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 12px 2px rgba(74,99,255,.7)}
.crop input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 12px 2px rgba(74,99,255,.7)}
.crop input[type=range]:focus-visible{outline:2px solid var(--hi);outline-offset:4px;border-radius:999px}
.bubble{margin-bottom:8px;padding:6px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);font-size:14px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.name{margin:16px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.hd{margin:0;color:var(--muted);overflow-wrap:anywhere}
.bio{margin:16px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}.bio.empty{color:var(--muted)}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 0}
.rank{display:flex;align-items:baseline;gap:12px;margin:4px 0 0}.rank b{font-size:32px;letter-spacing:-.02em;line-height:1.1}.rank span{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--edge);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font:500 16px var(--sans);padding:8px 0;min-height:44px;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hi)}
.welcome{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between;margin-bottom:16px}
.welcome p{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;border-radius:999px;min-height:44px;padding:8px 24px;font:500 16px var(--sans);background:var(--ink);color:#000;text-decoration:none}
.btn.blue{background:var(--brand);color:#fff}.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--edge)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.badge{border:1px solid var(--edge);border-radius:12px;padding:12px;color:var(--muted)}
.badge b{display:block;font-size:14px}.badge span{font-size:12px}
.badge.on{background:rgba(20,48,255,.28);border-color:var(--hi);color:#fff;box-shadow:0 0 24px rgba(20,48,255,.35)}
.badge.on span{color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stats div{background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:12px;padding:12px}
.stats b{display:block;font-size:24px;letter-spacing:-.02em}.stats span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bars{margin-top:16px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 48px;gap:12px;align-items:center;font-size:14px}
.bar i{display:block;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}.bar i s{display:block;height:100%;background:var(--brand);border-radius:999px}
.bar em{font-style:normal;color:var(--muted);text-align:right}
ul.chips{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.chips a{display:block;padding:6px 12px;min-height:30px;border-radius:999px;border:1px solid var(--edge);background:rgba(20,48,255,.28);text-decoration:none;font-size:14px;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse}td{padding:8px 6px;border-bottom:1px solid var(--edge);overflow-wrap:anywhere}td:first-child{width:56px;color:var(--muted)}td:last-child{text-align:right;width:56px}
tr.me td{background:rgba(20,48,255,.35);color:#fff;font-weight:600}
.muted{color:var(--muted)}
label{display:block;font-size:14px;margin:16px 0 4px}label:first-of-type{margin-top:0}
input,textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:12px;color:var(--ink);font:16px var(--sans);padding:8px 12px;min-height:44px}
textarea{resize:vertical;min-height:96px}
.count{font-size:12px;color:var(--muted);text-align:right;margin:4px 0 0}
.msg{margin:4px 0 0;font-size:14px;min-height:21px}.msg.bad{color:var(--bad)}.msg.good{color:var(--ok)}
.actions{display:flex;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap}
.center{max-width:460px;margin:8vh auto 0;text-align:center;grid-column:1/-1}
.center h1{font-size:32px;margin:0 0 12px;letter-spacing:-.02em}
.sk{border-radius:12px;background:rgba(255,255,255,.08);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.ddpanel,.ddtrg svg{transition:none}}
.logotype { display: inline-block; aspect-ratio: 5033 / 1855; height: 28px; background: #fff; vertical-align: middle;
  -webkit-mask: url(brand/wordmark-latin.svg) center / contain no-repeat; mask: url(brand/wordmark-latin.svg) center / contain no-repeat; }
</style></head>
<body>
<header class="top"><a class="logo" href="index.html" aria-label="Nishkam home"><span class="logotype"></span></a><span class="pill" id="pts" hidden></span><a class="pill nophone" href="studio.html">Open Studio</a><span id="auth"></span></header>
<main id="main" class="wrap"></main>
<script type="module" src="profile.js"></script>
</body></html>
