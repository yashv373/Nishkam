<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your profile · Nishkam</title>
<link rel="icon" href="brand/favicon.svg">
<style>
:root{--bg:#000;--ink:#f5f5f7;--muted:#86868b;--brand:#1430ff;--hi:#4a63ff;--glass:rgba(255,255,255,.06);--edge:rgba(255,255,255,.14);--sans:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 600px at 80% -10%,rgba(20,48,255,.35),transparent 70%),var(--bg);color:var(--ink);font:17px/1.5 var(--sans);overflow-x:hidden}
a{color:inherit}
header{padding:20px 16px;max-width:760px;margin:0 auto}
header a{text-decoration:none;color:var(--muted);font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px 16px 64px}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:22px;padding:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 20px 60px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);margin-bottom:16px}
h1{font-size:clamp(34px,7vw,64px);line-height:1.05;letter-spacing:-.03em;margin:0 0 12px;font-weight:600}
.center{text-align:center;max-width:460px;margin:8vh auto 0}
.muted{color:var(--muted)}
.btn{display:inline-block;border:0;cursor:pointer;border-radius:999px;padding:12px 24px;font:500 16px var(--sans);background:#f5f5f7;color:#000;text-decoration:none}
.btn.blue{background:var(--brand);color:#fff}
.btn.big{display:block;text-align:center;padding:20px;font-size:clamp(20px,4vw,28px);margin-bottom:16px;box-shadow:0 14px 50px rgba(20,48,255,.4)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--edge)}
.who{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.who img,.who .ph{width:72px;height:72px;border-radius:50%;background:var(--brand);flex:none}
.who h2{margin:0;font-size:clamp(24px,5vw,36px);letter-spacing:-.02em;overflow-wrap:anywhere}
.who p{margin:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:20px}
.stats div{background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:16px;padding:14px}
.stats b{display:block;font-size:28px;letter-spacing:-.02em}
.stats span,.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px}
li a{display:block;padding:6px 14px;border-radius:999px;border:1px solid var(--edge);background:rgba(20,48,255,.18);text-decoration:none;font-size:14px;overflow-wrap:anywhere}
.err{color:#ff453a}
.btn.sm{padding:6px 14px;font-size:14px}
.handle{font-size:18px;color:var(--hi)}
.who input{background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:999px;color:var(--ink);font:16px var(--sans);padding:6px 12px;width:150px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.badge{border:1px solid var(--edge);border-radius:16px;padding:12px;opacity:.4}
.badge b{display:block;font-size:15px}.badge span{font-size:13px;color:var(--muted)}
.badge.on{opacity:1;background:rgba(20,48,255,.25);border-color:var(--hi);box-shadow:0 0 24px rgba(20,48,255,.35)}
table{width:100%;border-collapse:collapse;margin:10px 0 14px}td{padding:8px 6px;border-bottom:1px solid var(--edge);overflow-wrap:anywhere}td:first-child{width:56px;color:var(--muted)}td:last-child{text-align:right;width:56px}
tr.me td{background:rgba(20,48,255,.28);font-weight:600}
</style></head>
<body>
<header><a href="index.html">← Nishkam</a></header>
<main id="main"><p class="muted">Loading…</p></main>
<script type="module" src="profile.js"></script>
</body></html>
