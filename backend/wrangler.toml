name = "nishkam-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "nishkam"
database_id = "REPLACE_AFTER_wrangler_d1_create"

[ai]
binding = "AI"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"

[[r2_buckets]]
binding = "PRIVATE"
bucket_name = "nishkam-private"
